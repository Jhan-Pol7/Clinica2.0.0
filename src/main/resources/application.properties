# ===== H2 — base de datos en modo servidor TCP (accesible desde DBeaver) =====
# Modo archivo embebido (alternativa, sin acceso externo):
#db.url=jdbc:h2:file:./data/clinica;AUTO_SERVER=TRUE
# Modo servidor TCP: la app levanta un servidor H2 en el puerto fijo 9092 y
# DBeaver (u otro cliente) puede conectarse en caliente mientras la app corre.
db.url=jdbc:h2:tcp://localhost:9040/./data/clinica;DB_CLOSE_ON_EXIT=FALSE
db.h2server.enabled=true
db.h2server.port=9040
db.h2server.allowOthers=true
db.driver=org.h2.Driver
db.username=sa
db.password=
# ===== HikariCP — pool de conexiones =====
db.pool.maximumPoolSize=5
db.pool.minimumIdle=1
db.pool.connectionTimeout=30000
db.pool.idleTimeout=600000
db.pool.maxLifetime=1800000
# ===== DDL — inicialización automática =====
db.ddl.auto=true
db.ddl.script=schema_clinica.sql
